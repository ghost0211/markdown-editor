<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)" filter="url(#shadow)" />
  
  <!-- Subtle inner border -->
  <rect x="34" y="34" width="444" height="444" rx="94" fill="none" stroke="#93c5fd" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Markdown 'M' Logo & Arrow -->
  <g fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- M shape -->
    <path d="M 120 330 L 120 182 L 192 254 L 264 182 L 264 330" />
    <!-- Down Arrow -->
    <path d="M 370 182 L 370 330" />
    <path d="M 320 280 L 370 330 L 420 280" />
  </g>
</svg>
