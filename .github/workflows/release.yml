name: Release

on:
  # Push a version tag to cut a release: git tag v1.4.0 && git push origin v1.4.0
  push:
    tags:
      - 'v*'
  # Or trigger manually from the Actions tab
  workflow_dispatch:

jobs:
  release-windows:
    name: Build & Release (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard - tag must match tauri.conf.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "Tag: $TAG_VERSION, tauri.conf.json: $CONF_VERSION"
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match tauri.conf.json version ($CONF_VERSION)"
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npx vitest run

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseDraft: false
          prerelease: false
          releaseBody: |
            Markdown Editor ${{ github.ref_name }}
            - Windows 安装包 (MSI / NSIS) 见下方 Assets
