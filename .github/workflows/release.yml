name: Release

on:
  # Push a version tag to cut a release: git tag v1.4.0 && git push origin v1.4.0
  push:
    tags:
      - 'v*'
  # Or trigger manually from the Actions tab
  workflow_dispatch:

jobs:
  release-windows:
    name: Build & Release (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard - tag must match tauri.conf.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "Tag: $TAG_VERSION, tauri.conf.json: $CONF_VERSION"
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match tauri.conf.json version ($CONF_VERSION)"
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npx vitest run

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build app bundles
        run: npm run tauri build

      - name: List built bundles (diagnostics)
        shell: bash
        run: find src-tauri/target/release/bundle -maxdepth 2 -type f | sort

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release with installers
        uses: softprops/action-gh-release@v2
        with:
          # Uploads into the existing release for this tag if present
          # (e.g. one created manually from the tag page), otherwise creates it.
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
