name: Release

on:
  # The tag must match package.json, Cargo.toml and tauri.conf.json.
  push:
    tags:
      - 'v*'
  # Or trigger manually from the Actions tab
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build, e.g. v1.6.1'
        required: true
        type: string

jobs:
  release-windows:
    name: Build & Release (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Extract release notes from annotated tag
        id: notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          NOTES=$(git tag -l --format='%(contents)' "$RELEASE_TAG")
          {
            echo "body<<__RELEASE_NOTES_EOF__"
            echo "$NOTES"
            echo "__RELEASE_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard - release tag and application versions must match
        shell: bash
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [[ "$RELEASE_TAG" != v* ]] || [ "$TAG_VERSION" != "$CONF_VERSION" ] || [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Release tag must match all three application versions."
            exit 1
          fi

      - name: Guard - updater signing key is required
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Set the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing. See docs/auto-update.md.'
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npx vitest run

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and publish signed installers and updater manifest
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'MarkdownEditor ${{ env.RELEASE_TAG }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generateReleaseNotes: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis,msi

      - name: List built bundles (diagnostics)
        shell: bash
        run: find src-tauri/target/release/bundle -maxdepth 2 -type f | sort

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
